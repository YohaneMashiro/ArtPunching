name: Publish ArtPunching to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node for geometry checks
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify layout and rendering geometry
        working-directory: punch-studio
        run: node --test tests/core.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static editor
        uses: actions/upload-pages-artifact@v4
        with:
          path: punch-studio/dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
